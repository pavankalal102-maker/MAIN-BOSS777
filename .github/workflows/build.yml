name: Build Android APK (Boss777 Plain Splash)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Prepare Assets (Logo & Plain White Splash)
        run: |
          mkdir -p assets
          
          # Check if logo.png exists in root, copy to assets/icon.png
          if [ -f "logo.png" ]; then
            cp logo.png assets/icon.png
          else
            echo "Error: logo.png not found in root folder!"
            exit 1
          fi

          # Generate 100% Plain White Splash Screen SVG (Without any logo)
          cat << 'EOF' > assets/splash.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
            <rect width="2732" height="2732" fill="#FFFFFF"/>
          </svg>
          EOF

      - name: Build Web App Bundle
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true

      - name: Add Capacitor Android Platform
        run: |
          npx cap add android

      - name: Generate App Icons and Plain Splash Screen
        run: |
          npx cap-assets generate --android

      - name: Sync Capacitor Project
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Output APK File
        uses: actions/upload-artifact@v4
        with:
          name: BOSS777-Native-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
