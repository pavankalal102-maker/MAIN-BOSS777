name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Assets & Web Directory
      run: |
        # Create web directory and copy app files
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp -r main-app www/ 2>/dev/null || true
        cp -r review-app www/ 2>/dev/null || true
        
        # Icon Assets directory setup
        mkdir -p assets
        
        if [ -f logo.png ]; then
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/icon-background.png
          cp logo.png assets/icon.png
        else
          echo 'Creating fallback icon'
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="#ffffff"/></svg>' > assets/icon.png
        fi

        # Generate Plain White Splash Screen SVG Asset
        cat << 'EOF' > assets/splash.svg
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
          <rect width="2732" height="2732" fill="#FFFFFF"/>
        </svg>
        EOF

        cat << 'EOF' > assets/splash-dark.svg
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
          <rect width="2732" height="2732" fill="#FFFFFF"/>
        </svg>
        EOF

    - name: Install Capacitor Dependencies
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest

    - name: Initialize & Sync Capacitor Project
      run: |
        npx cap init "BOSS777" "com.boss777.hub" --web-dir www
        npx cap add android
        
        # Generate Native App Icons & White Splash Screen
        npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff"
        
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOSS777-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
